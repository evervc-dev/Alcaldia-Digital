# kit-sede-02: DHCP de la LAN de la sede (sin DNS local: los clientes usan dc1/dc2 por el túnel)
interface=eth1
bind-interfaces
port=0
dhcp-range=10.100.2.100,10.100.2.199,255.255.255.0,12h
dhcp-option=option:router,10.100.2.1
dhcp-option=option:dns-server,10.10.20.10,10.20.20.10
dhcp-option=option:domain-search,ad.alcaldia.lab
dhcp-authoritative
