frr defaults traditional
hostname kit-sede-01
log syslog informational
!
interface vti-a1
 ip ospf network point-to-point
 ip ospf mtu-ignore
 ip ospf cost 10
 ip ospf hello-interval 2
 ip ospf dead-interval 8
exit
interface vti-a2
 ip ospf network point-to-point
 ip ospf mtu-ignore
 ip ospf cost 20
 ip ospf hello-interval 2
 ip ospf dead-interval 8
exit
interface vti-b
 ip ospf network point-to-point
 ip ospf mtu-ignore
 ip ospf cost 100
 ip ospf hello-interval 2
 ip ospf dead-interval 8
exit
!
router ospf
 ospf router-id 10.100.1.1
 passive-interface eth1
 network 172.16.1.0/28 area 0
 network 10.100.1.0/24 area 0
exit
!
