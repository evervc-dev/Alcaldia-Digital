# kit-sede-01: 3 túneles IKEv2 SALIENTES (la sede está tras CGNAT: NAT-T). Identidad: FQDN. PSK en acc-secrets.conf (no en git).
connections {
    a-wan1 {
        version = 2
        remote_addrs = 203.0.113.4
        mobike = no
        keyingtries = 0
        dpd_delay = 5s
        local { auth = psk
                id = kit-sede-01.alcaldia.lab }
        remote { auth = psk
                 id = 203.0.113.4 }
        children {
            a-wan1 { local_ts = 0.0.0.0/0
                 remote_ts = 0.0.0.0/0
                 if_id_in = 1
                 if_id_out = 1
                 start_action = start
                 dpd_action = restart
                 close_action = start }
        }
    }
    a-wan2 {
        version = 2
        remote_addrs = 198.51.100.4
        mobike = no
        keyingtries = 0
        dpd_delay = 5s
        local { auth = psk
                id = kit-sede-01.alcaldia.lab }
        remote { auth = psk
                 id = 198.51.100.4 }
        children {
            a-wan2 { local_ts = 0.0.0.0/0
                 remote_ts = 0.0.0.0/0
                 if_id_in = 2
                 if_id_out = 2
                 start_action = start
                 dpd_action = restart
                 close_action = start }
        }
    }
    b {
        version = 2
        remote_addrs = 203.0.113.10
        mobike = no
        keyingtries = 0
        dpd_delay = 5s
        local { auth = psk
                id = kit-sede-01.alcaldia.lab }
        remote { auth = psk
                 id = 203.0.113.10 }
        children {
            b { local_ts = 0.0.0.0/0
                 remote_ts = 0.0.0.0/0
                 if_id_in = 3
                 if_id_out = 3
                 start_action = start
                 dpd_action = restart
                 close_action = start }
        }
    }
}
include /etc/swanctl/acc-secrets.conf
