frr defaults traditional
hostname inet-core
log syslog informational
!
router bgp 65000
 bgp router-id 192.0.2.1
 no bgp ebgp-requires-policy
 neighbor 192.0.2.2 remote-as 65001
 neighbor 192.0.2.2 description ISP1
 neighbor 192.0.2.6 remote-as 65002
 neighbor 192.0.2.6 description ISP2
 address-family ipv4 unicast
  network 198.18.0.0/24
  neighbor 192.0.2.2 default-originate
  neighbor 192.0.2.6 default-originate
 exit-address-family
!
line vty
!
