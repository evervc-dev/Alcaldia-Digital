# lam.evervc.dev: gestión de identidades (LAM). SIN DNS público: solo se resuelve por WARP (Gateway DNS -> 10.10.30.10).
# HTTPS con certificado Let's Encrypt (DNS-01). Acceso: WARP (correos autorizados) -> Authelia MFA (gestores-identidad)
# -> login de LAM con la cuenta AD del técnico -> permisos delegados del AD.
server {
    listen 443 ssl;
    server_name lam.evervc.dev;
    ssl_certificate     /etc/nginx/conf.d/certs/lam.evervc.dev.crt;
    ssl_certificate_key /etc/nginx/conf.d/certs/lam.evervc.dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    location = /internal/authz { internal; proxy_pass http://10.10.20.13:9200/authz;
        proxy_pass_request_body off; proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL https://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Cookie $http_cookie; }
    location @fuera_horario { proxy_pass http://10.10.20.13:9200/denegado?u=$gate_user; }
    # Horarios y accesos de emergencia: gate comprueba él mismo la sesión con Authelia (no confía en cabeceras)
    location = /accesos { proxy_pass http://10.10.20.13:9200; proxy_set_header Host $host; proxy_set_header Cookie $http_cookie; proxy_set_header Origin $http_origin; }
    location = / { return 302 /lam/; }
    location / {
        auth_request /internal/authz;
        auth_request_set $redirection_url $upstream_http_location;
        auth_request_set $gate_user $upstream_http_x_gate_user;
        error_page 401 =302 $redirection_url;
        error_page 403 = @fuera_horario;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://10.10.20.50:80;
    }
}
