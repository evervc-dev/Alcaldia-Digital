# nginx-dmz (Site A): proxy inverso publicado por Cloudflare Tunnel (TLS termina en Cloudflare).
# portal  -> público, salvo /funcionarios (MFA + horario)
# archivo -> todo con MFA + horario
# auth    -> Authelia
# Control de acceso: auth_request -> horario-gate (/authz), que consulta a Authelia y aplica logonHours del AD.

map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" https; }

server { listen 80 default_server; return 404; }

server {
    listen 80;
    server_name auth.evervc.dev;
    location / {
        proxy_pass http://10.10.20.11:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
    }
}

# --- bloque común de autorización (incluido en las ubicaciones protegidas) ---
# (se define como ubicaciones internas por servidor)

server {
    listen 80;
    server_name portal.evervc.dev;
    location = /internal/authz { internal; proxy_pass http://10.10.20.13:9200/authz;
        proxy_pass_request_body off; proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $fwd_proto://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip; proxy_set_header Cookie $http_cookie; }
    location @fuera_horario { proxy_pass http://10.10.20.13:9200/denegado?u=$gate_user; }
    location /funcionarios {
        auth_request /internal/authz;
        auth_request_set $redirection_url $upstream_http_location;
        auth_request_set $acc_user $upstream_http_remote_user;
        auth_request_set $acc_groups $upstream_http_remote_groups;
        auth_request_set $gate_user $upstream_http_x_gate_user;
        error_page 401 =302 $redirection_url;
        error_page 403 = @fuera_horario;
        proxy_set_header Remote-User $acc_user;
        proxy_set_header Remote-Groups $acc_groups;
        proxy_set_header Host $host;
        proxy_pass http://10.10.20.20:8000;
    }
    location / {
        proxy_set_header Remote-User "";          # el público nunca puede inyectar identidad
        proxy_set_header Host $host;
        proxy_pass http://10.10.20.20:8000;
    }
}

server {
    listen 80;
    server_name archivo.evervc.dev;
    client_max_body_size 200m;
    location = /internal/authz { internal; proxy_pass http://10.10.20.13:9200/authz;
        proxy_pass_request_body off; proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL $fwd_proto://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip; proxy_set_header Cookie $http_cookie; }
    location @fuera_horario { proxy_pass http://10.10.20.13:9200/denegado?u=$gate_user; }
    location / {
        auth_request /internal/authz;
        auth_request_set $redirection_url $upstream_http_location;
        auth_request_set $acc_user $upstream_http_remote_user;
        auth_request_set $gate_user $upstream_http_x_gate_user;
        error_page 401 =302 $redirection_url;
        error_page 403 = @fuera_horario;
        proxy_set_header Remote-User $acc_user;
        proxy_set_header Host $host;
        proxy_pass http://10.10.20.21:80;
    }
}

# monitor -> Zabbix (F8). Protegido por Cloudflare Access (solo equipo TI, PIN por correo) + login de Zabbix.
# Defensa en profundidad: sin la cabecera que añade Access, se rechaza.
server {
    listen 80;
    server_name monitor.evervc.dev;
    location / {
        if ($http_cf_access_jwt_assertion = "") { return 403; }
        proxy_pass http://10.10.20.33:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
    }
}
