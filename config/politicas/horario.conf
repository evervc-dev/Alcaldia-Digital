# Política de horario laboral (fuente única, versionada). La aplican:
#   - ts1 (escritorios RDP): /opt/acc/horario.sh al iniciar la sesión -> ventana con el motivo y cierre de sesión
#   - horario-gate (portal /funcionarios y archivo): página con el motivo
# Quién está restringido lo decide el AD: pertenencia a GRUPO_RESTRINGIDO y no a GRUPO_EXENTO.
GRUPO_RESTRINGIDO=funcionarios
GRUPO_EXENTO=acceso-24h
DIAS=1,2,3,4,5            # 1=lunes ... 7=domingo
DESDE=08:00
HASTA=16:00
TZ_OFFSET=-6              # El Salvador (UTC-6, sin horario de verano)
