# ts1: servidor miembro del dominio (solo autenticación/identidades, sin comparticiones)
[global]
    security = ADS
    realm = AD.ALCALDIA.LAB
    workgroup = ALCALDIA
    idmap config * : backend = tdb
    idmap config * : range = 3000-7999
    idmap config ALCALDIA : backend = rid
    idmap config ALCALDIA : range = 10000-999999
    template homedir = /home/%D/%U
    template shell = /bin/bash
    winbind use default domain = yes
    winbind refresh tickets = yes
    winbind offline logon = no
    kerberos method = secrets and keytab
    disable netbios = yes
