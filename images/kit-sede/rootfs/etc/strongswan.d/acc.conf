# Kit de sede: túneles route-based (interfaces XFRM). Las rutas las pone OSPF (FRR), no strongSwan.
charon {
    install_routes = no
    # reintentos IKE cortos (T3: ~10 s para dar por muerto al par tras perder fw-a1; por defecto ~165 s)
    retransmit_timeout = 1.5
    retransmit_base = 1.4
    retransmit_tries = 3
    install_virtual_ip = no
}
