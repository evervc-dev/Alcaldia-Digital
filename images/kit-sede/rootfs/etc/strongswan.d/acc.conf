# Kit de sede: túneles route-based (interfaces XFRM). Las rutas las pone OSPF (FRR), no strongSwan.
charon {
    install_routes = no
    # reintentos IKE cortos: tras un corte de la WAN el kit vuelve a negociar en segundos (por defecto ~3 min de backoff)
    retransmit_timeout = 2.0
    retransmit_base = 1.4
    retransmit_tries = 4
    install_virtual_ip = no
}
