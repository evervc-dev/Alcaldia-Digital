# ACC — inicio de sesión único en mesa.evervc.dev: la cabecera Remote-User la fija nginx-dmz (10.10.30.10)
# después de Authelia (MFA) y del control de horario. Si la petición llega desde cualquier otro origen
# (p. ej. otro servidor de la VLAN, que no pasa por el firewall), la cabecera se descarta: nadie puede suplantar a un usuario.
<If "! -R '10.10.30.10/32'">
    RequestHeader unset Remote-User
</If>
