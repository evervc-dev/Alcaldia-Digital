
!
frr version 10.0
frr defaults traditional
hostname kit-sede-03
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface vti-a1
 ip ospf cost 10
 ip ospf dead-interval 8
 ip ospf hello-interval 2
 ip ospf mtu-ignore
 ip ospf network point-to-point
exit
!
interface vti-a2
 ip ospf cost 20
 ip ospf dead-interval 8
 ip ospf hello-interval 2
 ip ospf mtu-ignore
 ip ospf network point-to-point
exit
!
interface vti-b
 ip ospf cost 100
 ip ospf dead-interval 8
 ip ospf hello-interval 2
 ip ospf mtu-ignore
 ip ospf network point-to-point
exit
!
interface eth1
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.100.3.1
 network 10.100.3.0/24 area 0
 network 172.16.3.0/28 area 0
exit
!
end
